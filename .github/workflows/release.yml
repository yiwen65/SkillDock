name: Release

# Trigger either by pushing a semver tag (v1.2.3) or manually via the Actions
# tab. Manual dispatch is useful for re-running a release against an existing
# tag without re-tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist in the repo."
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find draft release
        id: create
        uses: actions/github-script@v8
        with:
          script: |
            const tag = "${{ steps.resolve.outputs.tag }}";
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              core.info(`Found existing release ${release.id} for tag ${tag}`);
            } catch (e) {
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                draft: true,
                prerelease: false,
                body: `Automated release for ${tag}.`,
              })).data;
              core.info(`Created draft release ${release.id} for tag ${tag}`);
            }
            return release.id;

  build:
    name: Build (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --features desktop -c src-tauri/tauri.release.conf.json
          - label: linux-x86_64
            platform: ubuntu-22.04
            rust-targets: ""
            tauri-args: --features desktop -c src-tauri/tauri.release.conf.json
          - label: linux-arm64
            platform: ubuntu-22.04-arm
            rust-targets: ""
            tauri-args: --features desktop -c src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-bin: false
          # Release builds differ from debug; keep a release-specific cache key.
          key: release-${{ matrix.label }}

      # Tauri on Linux needs WebKitGTK + a handful of GTK helpers.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS codesign + notarize and Tauri updater signing are opt-in.
          # They are intentionally NOT wired here as `APPLE_CERTIFICATE: ${{ secrets... }}`
          # because GitHub Actions resolves unset secrets to the empty string,
          # and Tauri's bundler treats a defined-but-empty APPLE_CERTIFICATE
          # as "please sign" — which then fails on `security import`. When
          # you are ready to sign, follow docs/RELEASING.md to populate the
          # six Apple secrets (or two updater secrets) and paste the
          # corresponding env block from that doc back into this step.
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.tauri-args }}

      # tauri-action uploads .dmg + .app.tar.gz on macOS but not a raw .zip of
      # the .app bundle. Build and upload that separately to match the target
      # release layout.
      - name: Zip macOS .app bundle
        if: matrix.label == 'macos-universal'
        run: |
          set -euo pipefail
          APP_DIR="$GITHUB_WORKSPACE/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_NAME=$(ls "$APP_DIR" | grep '\.app$' | head -n1)
          VERSION=$(node -p "require('./package.json').version")
          ZIP_NAME="SkillDock_${VERSION}_macos_universal.zip"
          ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"
          ( cd "$APP_DIR" && zip -ry "$ZIP_PATH" "$APP_NAME" )
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Upload macOS .zip to release
        if: matrix.label == 'macos-universal'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ env.ZIP_PATH }}
          draft: true

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Flip draft release to published
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
